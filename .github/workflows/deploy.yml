name: Production Quality Gate & Deployment

on:
  push:
    branches:
      - main
      - master

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Test Suite
        run: npm run test

  deploy:
    name: Build & Deploy
    needs: test
    runs-on: [self-hosted, windows-server]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Code to Application Directory
        shell: powershell
        run: |
          Write-Host "Syncing code to production directory..."
          $targetDir = "C:\apps\sisfo-alazhar-sd"
          
          if (!(Test-Path -Path $targetDir)) {
            New-Item -ItemType Directory -Path $targetDir -Force
          }
          
          # Sinkronisasi file kecuali node_modules, .git, dan .env
          robocopy . $targetDir /E /XD node_modules .git /XF .env /NFL /NDL /NJH /NJS /nc /ns /np
          
          # Robocopy mengembalikan exit code < 8 jika berhasil/ada file yang tersalin
          if ($LASTEXITCODE -ge 8) {
            throw "Robocopy failed with exit code $LASTEXITCODE"
          }

      - name: Install Dependencies, Migrate & Build
        shell: powershell
        run: |
          cd C:\apps\sisfo-alazhar-sd
          
          Write-Host "Installing dependencies..."
          npm ci
          
          Write-Host "Generating Prisma Client..."
          npx prisma generate
          
          Write-Host "Pushing Database Schema..."
          npx prisma db push --skip-generate
          
          Write-Host "Building Next.js Application..."
          npm run build

      - name: Reload PM2 Process
        shell: powershell
        run: |
          cd C:\apps\sisfo-alazhar-sd
          Write-Host "Reloading application with zero-downtime..."
          pm2 reload sisfo-sdia || pm2 start ecosystem.config.cjs
          pm2 save
          Write-Host "Deployment completed successfully!"
